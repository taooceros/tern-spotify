[package]
name = "tern-spotify"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.22"
env_logger = "0.11"
futures-util = "0.3"
libc = "0.2"
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-oauth = "0.8"
log = "0.4"
mdns-sd = "0.21"
protobuf = "3.7"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "process", "io-util"] }
tokio-tungstenite = "0.28"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
souvlaki = "0.8"

